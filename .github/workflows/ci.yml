name: CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localhost:4566
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check app tests

      - name: Run tests
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: uv run pytest -v

  build-and-deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Floci
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:4566/ >/dev/null 2>&1 || curl -fsS http://localhost:4566/_floci/health >/dev/null 2>&1; then
              echo "Floci is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Floci did not become ready in time" >&2
          exit 1

      - name: Prepare local AWS resources in Floci
        run: |
          aws --endpoint-url "$AWS_ENDPOINT_URL" ecr create-repository \
            --repository-name url-shortener --region "$AWS_DEFAULT_REGION" >/dev/null 2>&1 || true
          aws --endpoint-url "$AWS_ENDPOINT_URL" secretsmanager create-secret \
            --name url-shortener/db-password --secret-string "PASSWORD" --region "$AWS_DEFAULT_REGION" >/dev/null 2>&1 || true
          aws --endpoint-url "$AWS_ENDPOINT_URL" secretsmanager create-secret \
            --name url-shortener/grafana-password --secret-string "admin" --region "$AWS_DEFAULT_REGION" >/dev/null 2>&1 || true

      - name: Build application image
        run: docker build -t url-shortener:local .

      - name: Deploy stack (local, Floci-backed)
        run: |
          # Start only app dependencies and app; Floci is provided as a CI service
          docker compose up -d db
          # Wait for DB health
          for i in {1..30}; do
            if docker compose exec -T db pg_isready -U username -d default_database >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker compose up -d --build app
          docker compose ps

      - name: Smoke check
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "App is healthy"
              curl -fsS http://localhost:8000/health || true
              exit 0
            fi
            sleep 2
          done
          echo "App health check failed" >&2
          docker compose logs --no-color --tail=200 app db || true
          exit 1
