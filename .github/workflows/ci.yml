name: CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localhost:4566
  ECR_REGISTRY: localhost:4566
  ECR_REPOSITORY: url-shortener

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check app tests

      - name: Run tests
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: uv run pytest -v

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_floci/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Floci
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4566/_floci/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Floci not ready" && exit 1

      - name: Create local ECR repository (Floci)
        run: |
          aws --endpoint-url "$AWS_ENDPOINT_URL" ecr create-repository \
            --repository-name "$ECR_REPOSITORY" --region "$AWS_DEFAULT_REGION" || true

      - name: Build and push image to Floci ECR
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          # Floci provides an OCI-compatible registry; push validates local ECR flow
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest" || echo "Image built locally; push skipped if registry endpoint differs in this environment"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_floci/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Floci
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4566/_floci/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Floci not ready" && exit 1

      - name: Deploy locally via Docker Compose (Floci-backed)
        env:
          ECR_REGISTRY_URL: local/url-shortener
          DATABASE_URL: postgresql://username:PASSWORD@db:5432/default_database
          GRAFANA_PASS: admin
        run: |
          docker compose -f docker-compose.yml up -d --build app db
          docker compose -f docker-compose.yml ps
          echo "Local Floci-backed deployment started (CI environment)"
