# TODO: GitHub Actions workflow
#
# Trigger: push and pull_request on main
#
# Job 1 (lint-and-test):
#   - checkout
#   - setup-python
#   - pip install -r requirements-dev.txt
#   - ruff check (lint)
#   - pytest
#
# Job 2 (build-image), depends on job 1:
#   - docker/setup-buildx-action
#   - docker/build-push-action (push: false for now, build only)
#
# Later add: push the image to ECR/Docker Hub + a terraform apply step

name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff (auto-fix)
        run: uv run ruff check app tests --fix

      - name: Commit lint fixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto-fix linting issues [skip ci]"
            git push
          fi

      - name: Run tests
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: uv run pytest -v

  build-image:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: url-shortener:latest

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd Self-hosted-CI-CD-platform
            git pull
            docker compose -f docker-compose.prod.yml up --build -d
