name: CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check app tests

      - name: Run tests
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: uv run pytest -v

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to Amazon ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.ECR_REPOSITORY_URL }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            TARGET_DIR="/home/ubuntu/Self-hosted-CI-CD-platform"

            if [ ! -d "$TARGET_DIR/.git" ]; then
              rm -rf "$TARGET_DIR"
              git clone https://github.com/Kedarini/Self-hosted-CI-CD-platform.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            git fetch origin main
            git reset --hard origin/main

            DB_PASSWORD=$(aws secretsmanager get-secret-value --secret-id url-shortener/db-password --query SecretString --output text --region eu-central-1)
            GRAFANA_PASS_VALUE=$(aws secretsmanager get-secret-value --secret-id url-shortener/grafana-password --query SecretString --output text --region eu-central-1)
            RDS_ENDPOINT=$(aws rds describe-db-instances --db-instance-identifier url-shortener-db --query "DBInstances[0].Endpoint.Address" --output text --region eu-central-1)

            export DATABASE_URL="postgresql://postgres:${DB_PASSWORD}@${RDS_ENDPOINT}:5432/urlshortener?sslmode=require"
            export GRAFANA_PASS="${GRAFANA_PASS_VALUE}"
            export ECR_REGISTRY_URL="${{ secrets.ECR_REPOSITORY_URL }}"

            aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin "${{ secrets.ECR_REPOSITORY_URL }}"

            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
